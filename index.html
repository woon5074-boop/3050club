<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>3050파크골프클럽 | 30·40·50 파크골프를 사랑하는 분들의 모임</title>
<meta name="description" content="젊은 파크골프 동호회 3050파크골프클럽. 월례회 신청, 스코어 랭킹, 회원 소통을 한 곳에서.">
<meta name="theme-color" content="#0F4A37">
<meta property="og:title" content="3050파크골프클럽">
<meta property="og:description" content="30·40·50 파크골프를 사랑하는 분들의 모임 — 함께 치면 더 즐겁다">
<meta property="og:image" content="https://www.3050club.co.kr/assets/og.jpg">
<meta property="og:url" content="https://www.3050club.co.kr">
<link rel="icon" href="assets/logo.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="3050클럽">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#0F4A37;--g2:#1F6B4A;--gd:#0B3A2B;--ink:#14231C;--mute:#55645C;--bg:#F4EEE2;--card:#FFFDF8;--line:#E2D9C8;--sun:#F2A541;--red:#C42B21;--mint:#DCEBDD;--rose:#FBE3DF;--disp:'Black Han Sans','IBM Plex Sans KR',sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:#E9E0CE}
body{margin:0;font-family:'IBM Plex Sans KR',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:var(--ink);font-size:15px;line-height:1.5;word-break:keep-all}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;transition:transform .12s ease,background .2s,opacity .2s}
button:active,.press:active{transform:scale(.96)}
button:disabled{opacity:.5;cursor:default}
a{color:var(--g)}
img{max-width:100%;display:block}
h1,h2,h3,p{margin:0}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);position:relative;display:flex;flex-direction:column;overflow-x:hidden}
@media(min-width:520px){#app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:14px 20px 10px;background:rgba(244,238,226,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.top img{width:38px;height:38px;border-radius:50%}
.top .tt{flex:1;min-width:0}
.top .t1{font-family:var(--disp);font-size:20px;color:var(--g);line-height:1.2}
.top .t2{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.dark{background:var(--ink)}.top.dark .t1{color:#fff}.top.dark .t2{color:#C9D3CD}
.icb{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;flex-shrink:0}
main{flex:1;display:flex;flex-direction:column;gap:24px;padding:6px 0 110px}
.px{margin-left:20px;margin-right:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px}
.sec{display:flex;align-items:center;justify-content:space-between;padding:0 20px;min-height:32px}
.sec h2{font-size:18px;font-weight:700}
.sec button{border:0;background:none;color:var(--g);font-weight:600;font-size:13px;min-height:44px;display:inline-flex;align-items:center;gap:4px}
.stack{display:flex;flex-direction:column;gap:10px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;background:var(--mint);color:var(--g);font-size:12px;font-weight:700;white-space:nowrap;border:1px solid transparent}
.chip.sun{background:var(--sun);color:var(--ink)}.chip.red{background:var(--red);color:#fff}.chip.w{background:#fff;color:var(--g)}.chip.dk{background:var(--gd);color:#fff}.chip.rose{background:var(--rose);color:var(--red)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tab{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--g);border-color:var(--g);color:#fff}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px}
.seg button{min-height:44px;border:0;border-radius:10px;background:transparent;font-weight:600;font-size:14px}
.seg button.on{background:var(--g);color:#fff;font-weight:700}
.btn{min-height:48px;padding:0 18px;border:0;border-radius:14px;background:var(--g);color:#fff;font-weight:700;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.w{background:#fff;color:var(--g)}.btn.sun{background:var(--sun);color:var(--ink)}.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line);font-weight:600}.btn.line{background:transparent;color:#fff;border:1px solid #5C8C78}.btn.sm{min-height:44px;padding:0 14px;font-size:13px;border-radius:12px}.btn.red{background:var(--red)}
.btn.block{width:100%}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:#fff;flex-shrink:0}
.disp{font-family:var(--disp);font-weight:400}
.mute{color:var(--mute)}.s12{font-size:12px}.s13{font-size:13px}.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}.grow{flex:1;min-width:0}
.hero{position:relative;border-radius:26px;overflow:hidden;height:340px;background:var(--g)}
.hero img{width:100%;height:100%;object-fit:cover;opacity:.55;transform:scale(1.08);animation:kb 18s ease-in-out infinite alternate}
@keyframes kb{to{transform:scale(1.2) translate(-2%,2%)}}
.hero .in{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;gap:10px;padding:22px}
.hero h1{font-family:var(--disp);font-weight:400;font-size:38px;line-height:1.12;color:#fff}
.next{background:var(--g);color:#fff;border-radius:22px;padding:20px;display:flex;flex-direction:column;gap:14px}
.cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cd div{background:var(--gd);border-radius:14px;padding:10px 0;text-align:center}
.cd b{display:block;font-family:var(--disp);font-weight:400;font-size:24px;line-height:1.2}.cd span{font-size:11px;color:#CFE6D6}
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quick button{min-height:84px;border-radius:18px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:12px;font-weight:600}
.quick svg{color:var(--g)}
.bar{height:8px;border-radius:99px;background:var(--mint);overflow:hidden}.bar i{display:block;height:100%;background:var(--g2);border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.g3 img,.g3 button{width:100%;aspect-ratio:1/1.15;object-fit:cover;border-radius:16px;border:0;padding:0;background:var(--mint);overflow:hidden}
.g3 button img{height:100%;border-radius:0}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:8px 8px calc(10px + env(safe-area-inset-bottom))}
.nav button{border:0;background:transparent;border-radius:14px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--mute)}
.nav button.on{background:var(--mint);color:var(--g);font-weight:700}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600}
.inp{min-height:50px;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:0 14px;width:100%;outline:none}
textarea.inp{padding:12px 14px;min-height:110px;resize:vertical}
.inp:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(31,107,74,.15)}
.sheet-bg{position:fixed;inset:0;background:rgba(20,35,28,.5);z-index:50;opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg.on{opacity:1}
.sheet{width:100%;max-width:480px;max-height:92dvh;overflow-y:auto;background:var(--bg);border-radius:26px 26px 0 0;padding:10px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.9,.2,1);display:flex;flex-direction:column;gap:16px}
.sheet-bg.on .sheet{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 4px}
.sheet h3{font-family:var(--disp);font-weight:400;font-size:24px;color:var(--g)}
#toast{position:fixed;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transition:all .3s;z-index:80;pointer-events:none;max-width:88vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .55s ease,transform .55s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1)}@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}
.confetti{position:fixed;width:9px;height:14px;border-radius:3px;z-index:90;pointer-events:none;animation:fall 1.1s ease-out forwards}
@keyframes fall{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--mint);border-top-color:var(--g);animation:sp .8s linear infinite;margin:60px auto}@keyframes sp{to{transform:rotate(360deg)}}
.demo{background:var(--sun);color:var(--ink);font-size:12px;font-weight:600;padding:8px 20px;display:flex;align-items:center;gap:8px}
.demo button{margin-left:auto;border:0;background:var(--ink);color:#fff;border-radius:99px;min-height:32px;padding:0 12px;font-size:12px;font-weight:700;white-space:nowrap}
.rank-row{display:grid;grid-template-columns:30px 1fr 40px 40px 52px;gap:6px;align-items:center;padding:10px 12px;border-radius:14px}
.rank-row.me{background:var(--mint)}
.pod{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;align-items:end}
.pod>div{display:flex;flex-direction:column;align-items:center;gap:8px;color:#fff}
.pod .st{width:100%;border-radius:16px 16px 0 0;background:var(--gd);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;transform-origin:bottom;animation:grow .7s cubic-bezier(.2,.9,.2,1) both}
.pod .st.first{background:var(--sun);color:var(--ink)}
@keyframes grow{from{transform:scaleY(0)}}
.team{padding:14px;border-radius:18px;display:flex;flex-direction:column;gap:9px}
.team .m{display:flex;align-items:center;gap:8px;font-weight:600;font-size:14px;border:0;background:none;padding:2px;border-radius:10px;text-align:left;min-height:32px}
.team .m.sel{background:var(--sun)}
.due{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 0;border-radius:14px;border:1px solid var(--line);background:var(--card);font-size:12px;font-weight:700;color:var(--mute)}
.due.ok{background:var(--mint);border-color:transparent;color:var(--g)}.due.no{background:var(--rose);border-color:transparent;color:var(--red)}
.due small{font-weight:600;color:var(--mute);font-size:12px}
.lb{position:fixed;inset:0;z-index:70;background:rgba(10,20,15,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;color:#fff}
.lb img{max-height:74dvh;border-radius:14px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:13px}.check input{width:22px;height:22px;accent-color:var(--g);flex-shrink:0;margin-top:1px}
.ft{padding:0 20px;font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.bell{position:relative}.bell i{position:absolute;top:-2px;right:-2px;min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:700;font-style:normal;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg)}
.top.dark .bell{background:transparent;border-color:#5C6B63;color:#fff}.top.dark .icb{margin-left:0}
.sct{width:100%;border-collapse:collapse;font-size:14px;table-layout:fixed}.sct th,.sct td{border-bottom:1px solid var(--line);padding:5px 2px;text-align:center}.sct thead th{font-size:12px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sct th:first-child{width:34px;color:var(--mute);font-size:12px}.sct .par{width:38px;color:var(--mute);font-size:13px}
.sc{width:100%;max-width:60px;min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--card);text-align:center;font-size:17px;font-weight:700;outline:none;-moz-appearance:textfield}.sc::-webkit-outer-spin-button,.sc::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}.sc:focus{border-color:var(--g2);box-shadow:0 0 0 3px rgba(31,107,74,.15)}.sc.ro{display:inline-flex;align-items:center;justify-content:center;border-color:transparent;background:transparent}.sc.hio{background:var(--sun);border-color:var(--sun)}.sc.bd{background:var(--mint);border-color:var(--mint);color:var(--g)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
